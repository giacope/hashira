checks:
  all: true
  # Change coupling reads git history, and CI checks out a single commit, so a
  # gate there would see none of it. Run it locally instead.
  change_coupling: false
layers:
  - cli
  - gates: [ci, diagram]
  - pipeline: ["(root)", report]
  - analyzers: [complexity, coupling, duplication, hotspots, smells, suppression]
  - foundation: [analysis, config]
boundaries:
  - root: Prism
    role: interpreted_model
    entrypoint: lib/hashira/trees.rb
    reason: >-
      every analyzer is an AST pattern-matcher, so Prism reaches all of them by design: each smell asks
      about a different node type, and an adapter fronting them would mirror Prism's hierarchy and tax
      every new check without decoupling anything
