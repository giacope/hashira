checks:
  all: true
  # Change coupling reads git history, and CI checks out a single commit, so
  # the ratchet would see its findings vanish there. Run it locally instead.
  change_coupling: false
layers:
  - cli
  - gates: [ci, diagram]
  - pipeline: ["(root)", report]
  - analyzers: [complexity, coupling, duplication, hotspots, smells, suppression]
  - foundation: [analysis, config]
