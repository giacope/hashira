name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/ci

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The fixed-answer suites: no corpus, no network. Any failing case fails the build.
      - run: eval/run --hashira . --suites complexity,coupling,duplication,smells,cli --label ci

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # kimera ci diffs against the base branch
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # main's full run stores which tests reach each file; the PR's run reads it.
      - uses: actions/cache/restore@v4
        with:
          path: tmp/kimera/coverage.json
          key: kimera-coverage-${{ github.event.pull_request.base.sha }}
          restore-keys: kimera-coverage-
      # Mutates every line of each file this PR changed, and the files its changed tests reach;
      # any surviving or uncovered mutant fails the build.
      - run: bundle exec kimera ci --since-scope impact

  mutation-full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Mutates all of lib. .kimera.yml allows no survivor, no uncovered mutant and
      # no ignore entry, so any of them fails the build.
      - run: bundle exec kimera run --jobs 4 --no-progress --reuse-coverage --report tmp/kimera/full.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: tmp/kimera/coverage.json
          key: kimera-coverage-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimera-full-report
          path: tmp/kimera/full.json
