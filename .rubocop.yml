plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - "eval/cases/**/*"
    - "eval/tmp/**/*"
    - "eval/results/**/*"
    - "vendor/**/*"

# Until rubocop-kata's self-hosting fixes (K5 words, K8 script boot layer) reach main:
Kata/RealWords:
  Terms:
    - hotspots
    - vendored

Kata/ClockDiscipline:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "eval/probe/peak.rb"

Kata/EnvDiscipline:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "eval/probe/peak.rb"
