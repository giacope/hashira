inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4

Kata/AgentNoun:
  AllowedNames:
    - Cluster
    - ControlParameter
    - Error
    - Roster

Kata/GoodMethodName:
  Terms:
    - on_duplicate_method_call
    - on_instance_variable_assumption
    - on_too_many_instance_variables

Kata/GoodVariableName:
  Terms:
    - fail_on

Kata/RealWords:
  Terms:
    - hotspots
    - rollup
    - sdp

Kata/ProsePlacement:
  Enabled: true
  Include:
    - "lib/**/*"
  Exclude:
    - "lib/hashira/report/**/*"
    - "lib/hashira/ci/**/*"
    - "lib/hashira/cli/flags.rb"
    - "lib/hashira/cli/usage.rb"

Elegant/NoRedundantVariable:
  AutoCorrect: true

Elegant/PairedBrackets:
  AutoCorrect: true

Elegant/ClassInModule:
  Enabled: true
