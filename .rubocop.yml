inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4

Kata/AgentNoun:
  AllowedNames:
    - Cluster
    - ControlParameter
    - Error
    - Roster

Kata/ProsePlacement:
  Enabled: true
  Include:
    - "lib/**/*"
  Exclude:
    - "lib/hashira/report/**/*"
    - "lib/hashira/ci/**/*"
    - "lib/hashira/cli/flags.rb"
    - "lib/hashira/cli/usage.rb"
