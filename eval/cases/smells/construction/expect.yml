# Core#setup sets every option as an instance variable by a computed name, so
# no class that includes Core assumes a "@shop_" read, whichever of its methods
# reaches setup (fog-openstack's Real and Mock services; caxlsx's writers).
# Stub has no such set: nothing ever assigns the variable it reads.
present:
  - {kind: assumed_state, package: "App::Stub"}
absent:
  - {kind: assumed_state, package: "App::Real"}
  - {kind: assumed_state, package: "App::Mock"}
