# Session hands three of its four public methods straight to the store it
# wraps: a middle man. Left alone: a wrapper that declares its delegation
# with Forwardable, a collection that only exposes its own enumeration, a
# facade that forwards to several collaborators, and a lock whose calls take a
# block that does the method's work.
present:
  - {kind: middle_man, package: "App::Session"}
absent:
  - {kind: middle_man, package: "App::Config"}
  - {kind: middle_man, package: "App::Bag"}
  - {kind: middle_man, package: "App::Shop"}
  - {kind: middle_man, package: "App::Tally"}
messages:
  - {kind: middle_man, package: "App::Session", includes: "forwards 3 of its 4 public methods to @store"}
evidence: [middle_man]
