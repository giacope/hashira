# Pinned external code the corpus suite measures. `args` are passed to
# hashira as given, run from the project's root. `config` is merged into
# `checks: all` for that project: the layers declared here are a plausible
# reading of each layout, there to measure layer_violation's cost.
projects:
  - name: rubocop
    url: https://github.com/rubocop/rubocop.git
    tag: v1.75.8
    sha: 38333dcec9987d31e4f0d18a1938237cc8aa8c4a
    args: [lib]
    config:
      layers:
        - interface: [lib/rubocop/cli, lib/rubocop/cli.rb, lib/rubocop/server, lib/rubocop/lsp, lib/rubocop/rake_task.rb]
        - run: [lib/rubocop/runner.rb, lib/rubocop/formatter, lib/rubocop/formatter.rb]
        - cops: [lib/rubocop/cop]
  - name: faraday
    url: https://github.com/lostisland/faraday.git
    sha: deeb6ef8e47b366581585ec40c30104bf500826f
    args: []
    config:
      layers:
        - middleware: [adapter, request, response, logging]
        - core: ["(root)"]
        - support: [options, encoders, utils]
  - name: rubygems.org
    url: https://github.com/rubygems/rubygems.org.git
    sha: be8fc6b7d005c30830d0efa5014091d3f1b2f479
    args: []
    config:
      layers:
        - web: [app/controllers, app/views, app/helpers, app/components, app/avo, app/policies]
        - app: [app/jobs, app/mailers, app/tasks, lib]
        - domain: [app/models, app/validators]
# Findings sampled per kind for precision labeling: the N findings whose
# SHA-256(key) sorts first, so a finding is in or out of the sample whatever
# version of hashira reported it. Labels live in results/labels/<kind>.yml.
samples:
  repeated_call: 25
  feature_envy: 25
  nil_check: 25
  manual_dispatch: 25
  duplication: 25
  control_parameter: 15
  utility_function: 15
  data_clump: 15
  state_sprawl: 15
  repeated_conditional: 15
  indirection: 20
  dead_code: 25
  change_coupling: 25
  concrete_inheritance: 25
  refused_bequest: 25
  low_cohesion: 25
  message_chain: 25
  data_class: 25
  middle_man: 25
